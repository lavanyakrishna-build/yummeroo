<style>

<style>
/* Layout: one narrow phone column — sticky search bar, mode switch, then a stream of recipe tickets; detail slides up as a sheet.
   Palette (Plum & Peach): plum (#77314C) for every button and action, a lighter plum for selected filters, peach for the logo and step numbers,
   neutrals tinted toward plum; slate blue = "you have it", deep peach = "you need it" and the match bar. */
:root {
  --bg: #f7f3f4;          /* warm paper, faint plum tint */
  --surface: #ffffff;
  --ink: #2a1d23;
  --ink-soft: #6b5a61;
  --line: #e8dfe2;
  --accent: #77314c;      /* plum: buttons and actions */
  --accent-ink: #ffffff;
  --accent-2: #9b6479;    /* selected filters */
  --accent-soft: #f3e6eb;
  --logo: #b0583a;        /* deep peach: the "roo" in the logo */
  --spice: #f7d2c1;       /* pale peach: step numbers */
  --spice-soft: #fdece4;  /* partial-recipe tag, notices */
  --chili: #b0583a;       /* deep peach: need / has meat */
  --chili-soft: #fdece4;
  --have: #2f5f8a;        /* slate blue: "you have it" chips, tags, ticked steps */
  --have-soft: #e3ecf5;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
/* One designed look (from the Yummeroo design canvas), shown the same in light and dark mode. */
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 720px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: -0.02em; margin: 0; line-height: 1; }
.brand h1 span { color: var(--logo); }
.brand small { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; }
.modes { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.modes button { border: 0; background: transparent; border-radius: 999px; padding: 9px 10px; font-weight: 600; font-size: 14px; color: var(--ink-soft); }
.modes button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.search { position: relative; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px 12px 40px; font-size: 16px; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--ink-soft); fill: none; stroke-width: 2; }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent-2); color: var(--accent-ink); border-color: var(--accent-2); }
select.chip { appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: right 13px center, right 8px center; background-size: 5px 5px; background-repeat: no-repeat; }

.result-note { color: var(--ink-soft); font-size: 13px; margin: 8px 2px 6px; font-variant-numeric: tabular-nums; }
.list { display: grid; gap: 10px; }
.card { display: grid; gap: 6px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 14px 12px; }
.card h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.2; letter-spacing: -0.01em; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--ink-soft); font-size: 13px; }
.meta .by { color: var(--ink-soft); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--bg); color: var(--ink-soft); letter-spacing: 0.01em; }
.tag.plant { background: var(--have-soft); color: var(--have); }
.tag.meat { background: var(--chili-soft); color: var(--chili); }
.tag.partial { background: var(--spice-soft); color: var(--ink); }
.tag.tried { background: var(--ink); color: var(--bg); }

.match { display: grid; gap: 6px; }
.bar { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--logo); border-radius: 99px; }
.missing { font-size: 13px; color: var(--ink-soft); }
.missing b { color: var(--chili); font-weight: 600; }
.ready { color: var(--have); font-weight: 700; font-size: 13px; }
.mrow { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: baseline; font-size: 13px; }
.mlabel { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--have); }
.mlabel.need { color: var(--chili); }
.uses { display: flex; flex-wrap: wrap; gap: 4px; }
.u { background: var(--have-soft); color: var(--have); font-weight: 600; padding: 1px 8px; border-radius: 999px; font-size: 12.5px; }
.need-list { color: var(--ink); }
.need-list em { color: var(--ink-soft); font-style: normal; }
.frac { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px; margin-top: 10px; }
.summary p { margin: 0; font-size: 14px; }
.jumps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.jump { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 4px; font-size: 12px; color: var(--ink-soft); display: grid; gap: 2px; justify-items: center; }
.jump b { font-family: var(--display); font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
.jump[data-jump="g0"]:not(.zero) { background: var(--have-soft); border-color: var(--have); }
.jump[data-jump="g0"]:not(.zero) b { color: var(--have); }
.jump.zero { opacity: 0.5; cursor: default; }
.staples-box { border-top: 1px solid var(--line); padding-top: 10px; }
.staples-box summary { font-size: 13px; color: var(--ink); font-weight: 600; cursor: pointer; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.staples-box .scount { background: var(--bg); border-radius: 99px; padding: 0 7px; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.staples-box .sprev { color: var(--ink-soft); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.staples-box[open] .sprev { display: none; }
.staples-box[open] { display: grid; gap: 10px; }
.staples-box p { margin: 0; font-size: 12.5px; color: var(--ink-soft); }

h2.section { font-family: var(--display); font-size: 15px; font-weight: 700; margin: 18px 2px 8px; display: flex; gap: 8px; align-items: baseline; }
h2.section small { font-family: var(--body); font-weight: 500; color: var(--ink-soft); font-size: 13px; }

/* pantry */
.pantry { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; margin-top: 4px; }
.pantry h2 { margin: 0; font-family: var(--display); font-size: 18px; }
.pantry p { margin: 0; color: var(--ink-soft); font-size: 13.5px; }
.add { position: relative; }
.add input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 11px 12px; font-size: 16px; }
.sugg { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.12); z-index: 4; max-height: 260px; overflow-y: auto; }
.sugg button { display: flex; justify-content: space-between; gap: 10px; width: 100%; border: 0; background: transparent; text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.sugg button:last-child { border-bottom: 0; }
.sugg button small { color: var(--ink-soft); }
.sugg button.on, .sugg button:hover { background: var(--bg); }
.have-list { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 5px 6px 5px 11px; font-size: 13px; font-weight: 600; background: var(--have-soft); color: var(--have); border: 0; }
.pill span { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: 13px; line-height: 1; }
.pill:hover span { background: var(--have); color: var(--surface); }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--ink-soft); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick .chip { padding: 5px 10px; }
.staples { font-size: 13px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.staples .chip { padding: 3px 9px; font-size: 12.5px; }
.staples .chip[aria-pressed="false"] { text-decoration: line-through; opacity: 0.6; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.linkish { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 13px; padding: 4px 0; }
.empty { text-align: center; color: var(--ink-soft); padding: 28px 12px; border: 1px dashed var(--line); border-radius: var(--r); }
.more { width: 100%; margin-top: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px; font-weight: 600; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgb(26 14 19 / 0.45); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); box-shadow: 0 -10px 40px rgb(0 0 0 / 0.18); }
@media (min-width: 760px) { .sheet { left: 50%; right: auto; width: 680px; transform: translateX(-50%); } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up 0.22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: 0.6; } } @media (min-width: 760px) { @keyframes up { from { transform: translate(-50%, 24px); opacity: 0.6; } } } }
.grab { width: 40px; height: 4px; border-radius: 9px; background: var(--line); margin: 4px auto 12px; }
.sheet h2 { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.12; margin: 0 0 6px; letter-spacing: -0.015em; text-wrap: balance; }
.sheet .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 12px; padding: 11px 16px; font-weight: 700; font-size: 14px; text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.notice { background: var(--spice-soft); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin: 10px 0; }
.ings { list-style: none; padding: 0; margin: 6px 0 0; display: grid; }
.ings li { border-bottom: 1px solid var(--line); }
.ings li:last-child { border-bottom: 0; }
.ing { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; width: 100%; text-align: left; border: 0; background: none; padding: 10px 0; font-size: 15px; line-height: 1.45; min-height: 44px; }
.ing .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--ink-soft); margin-top: 1px; display: grid; place-items: center; box-sizing: border-box; }
.ing.have .box { border-color: var(--have); }
.ing.need .box { border-color: var(--chili); }
.ing.opt { color: var(--ink-soft); }
.ing[aria-pressed="true"] .box { background: var(--have); border-color: var(--have); }
.ing[aria-pressed="true"] .box::after { content: ""; width: 5px; height: 10px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.ing[aria-pressed="true"] .txt { text-decoration: line-through; color: var(--ink-soft); }
.cl-head { display: flex; align-items: baseline; gap: 10px; margin: 18px 0 2px; }
.sheet .cl-head h4 { margin: 0; }
.cl-count { font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.cl-count.all { color: var(--have); font-weight: 700; }
.cl-reset { margin-left: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#myNote { width: 100%; margin-top: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px; font: inherit; font-size: 16px; line-height: 1.45; resize: vertical; min-height: 96px; color: var(--ink); }
.note-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
.note-status { font-size: 12.5px; color: var(--ink-soft); flex: 1 1 180px; min-width: 0; }
.note-status.ok { color: var(--have); font-weight: 600; }
.note-status.warn { color: var(--chili); }
.btn:disabled { opacity: 0.6; cursor: default; }
.tag.note { background: var(--accent-soft); color: var(--accent); }
.notes { color: var(--ink-soft); font-size: 14px; margin-top: 14px; }
.steps-hint { margin: 0 0 6px; font-size: 12.5px; color: var(--ink-soft); }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px; font-size: 15px; line-height: 1.5; }
.step .n { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--spice); color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.step[aria-pressed="true"] { opacity: 0.55; }
.step[aria-pressed="true"] span:last-child { text-decoration: line-through; }
.step[aria-pressed="true"] .n { background: var(--have); color: var(--surface); }
.step[aria-pressed="true"] .n { font-size: 0; }
.step[aria-pressed="true"] .n::after { content: ""; width: 6px; height: 12px; border: solid var(--surface); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.sheet h4 { margin: 18px 0 2px; }
.close { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 10px; border: 0; background: var(--bg); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; }
.sync { font-size: 12px; color: var(--ink-soft); text-align: center; margin-top: 24px; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Yumme<span>roo</span></h1><small id="count"></small></div>
    <div class="modes" role="tablist">
      <button id="tab-browse" role="tab" aria-selected="true">Find a recipe</button>
      <button id="tab-cook" role="tab" aria-selected="false">Cook with what I have</button>
    </div>
    <label class="search" id="searchBox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="Search dishes, ingredients, creators" autocomplete="off" aria-label="Search recipes">
    </label>
    <div class="chips" id="filters"></div>
  </header>

  <main>
    <section id="pantryPanel" hidden></section>
    <p class="result-note" id="note"></p>
    <div id="results"></div>
    <p class="sync" id="sync"></p>
  </main>
</div>
<div id="sheetRoot"></div>

0°C. Makes 18-19 vadas."]},{"id":152,"name":"Mor Kali (Savory Buttermilk-Rice Porridge)","cuisines":["Indian"],"fusion":false,"meal":"Lunch","time":null,"difficulty":"Easy","diet":"vegetarian","egg":false,"author":"@_nibbly_","link":"https://www.instagram.com/reel/DdbPG9IyHev/","notes":"Full quantities from the creator’s caption. From ‘The Paati Protocol’ series; her dad’s favorite comfort food, made when groceries run out. Mor kali thickens as it cools — stop once it leaves the sides of the pan and turns glossy.","incomplete":null,"tried":false,"ai":false,"ingredients":[{"name":"yogurt","optional":false,"raws":["500 ml curd (sour is best)"]},{"name":"water","optional":false,"raws":["500 ml water, to dilute curd into buttermilk"]},{"name":"flour","optional":false,"raws":["1 cup rice flour"]},{"name":"salt","optional":true,"raws":["1 tbsp salt, or to taste (mor milagai are already salty, adjust carefully)"]},{"name":"oil","optional":false,"raws":["3/4 cup sesame oil / gingelly oil, divided (1/2 cup + 1/4 cup)"]},{"name":"mustard seeds","optional":false,"raws":["1.5 tsp mustard seeds"]},{"name":"lentils (dal)","optional":false,"raws":["1.5 tsp urad dal"]},{"name":"curry leaves","optional":false,"raws":["A handful curry leaves"]},{"name":"green chilli","optional":false,"raws":["3 green chilies, finely chopped"]},{"name":"ginger","optional":false,"raws":["1/2 inch ginger, finely chopped"]},{"name":"mor milagai","optional":false,"raws":["7-8 mor milagai (buttermilk chilies), roughly chopped"]},{"name":"asafoetida (hing)","optional":false,"raws":["1/4 tsp hing (asafoetida)"]},{"name":"arisi appalam","optional":true,"raws":["Arisi appalam (rice appalam), for serving"]}],"method":["Whisk 500 ml curd with 500 ml water into 1 litre buttermilk; add the rice flour and salt, whisking until smooth and lump-free.","Heat 1/2 cup gingelly oil in a kadai; splutter the mustard seeds, then saute urad dal, curry leaves, green chilies, and ginger for a minute.","Add the chopped mor milag vel)","4-5 dried red chilies (adjust to taste)"]},{"name":"oil","optional":false,"raws":["1 tsp oil","4-5 tbsp gingelly oil"]},{"name":"black pepper","optional":false,"raws":["1 tsp black pepper powder (added after grinding)"]},{"name":"tamarind","optional":false,"raws":["PULIKAICHAL: 1 lime-sized ball tamarind"]},{"name":"water","optional":false,"raws":["2 cups hot water (use only as much as needed for a thick extract)"]},{"name":"mustard seeds","optional":false,"raws":["1/2 tsp mustard seeds"]},{"name":"asafoetida (hing)","optional":false,"raws":["3/4 tsp asafoetida (hing), plus an extra pinch"]},{"name":"curry leaves","optional":false,"raws":["5-10 curry leaves"]},{"name":"salt","optional":true,"raws":["Salt, to taste"]},{"name":"jaggery","optional":false,"raws":["1 tsp grated jaggery"]}],"method":["Heat 1 tsp oil; roast the chana dal, coriander seeds, fenugreek seeds, black sesame seeds, and dried red chilies until aromatic and golden.","Cool completely and grind into a coarse powder; mix in the black pepper powder and set aside.","Soak the tamarind in 2 cups hot water; squeeze well and strain to a thick extract.","Heat the gingelly oil; splutter the mustard seeds, then roast fenugreek seeds, dried red chilies, chana dal, asafoetida, and curry leaves until fragrant.","Pour in the strained tamarind extract; simmer until the raw smell disappears and it begins to thicken.","Mix in about 4 tbsp of the spice powder.","Add salt and an extra pinch of asafoetida; simmer until the pulikaichal thickens and oil separates.","Add the jaggery and simmer 1-2 minutes.","Cool and store in a clean, dry airtight container."]},{"id":157,"name":"Crispy Chilli Potato Bowl (500 kcal)","cuisines":["Fusion"],"fusion":true,"meal":"Dinner","time":null,"difficulty":"Easy","diet":"vegetarian","egg":false,"author":"@table.hygge","link":"https://www.instagram.com/reel/Dembw6whVwa/","notes":"Full quantities from the creator’s caption (1 serving). 500 kcal, approx 28 g protein. Inspired by aloo <script>
(() => {
const DATA = JSON.parse(document.getElementById("data").textContent);
const R = DATA.recipes;
const ALIASES = DATA.aliases;
const DEFAULT_STAPLES = DATA.staples;
// A generic ingredient is covered by any of its specific kinds.
const COVERS = {
  "cheese": ["mozzarella", "cheddar", "parmesan", "feta", "cream cheese"],
  "lentils (dal)": ["red lentils"],
  "oil": ["olive oil"], "olive oil": ["oil"],
  "ground meat": ["ground beef", "ground pork", "chicken"],
  "mixed herbs": ["oregano", "thyme", "basil", "parsley", "rosemary"],
  "stock / broth": [], "cream": [], "tomato": [],
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const keyOf = r => r.link || r.name;

// ---------- state ----------
const state = {
  mode: "browse", q: "", meal: null, diet: null, maxTime: null, cuisine: "", notTried: false, hideIncomplete: false,
  pantry: [], staples: DEFAULT_STAPLES.slice(), tried: {}, showAllCook: false, showIdeas: false, staplesOpen: false, browseLimit: 40,
};
const LS = "yummeroo.v1";
try { const s = JSON.parse(localStorage.getItem(LS) || "null"); if (s) { state.pantry = s.pantry || []; state.staples = s.staples || state.staples; state.tried = s.tried || {}; } } catch (e) {}

let remote = null, saveTimer = null, saving = false, pending = false;
function persist() {
  const body = { pantry: state.pantry, staples: state.staples, tried: state.tried };
  try { localStorage.setItem(LS, JSON.stringify(body)); } catch (e) {}
  if (!remote) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async function flush() {
    if (saving) { pending = true; return; }
    saving = true;
    try { await remote.set({ pantry: state.pantry, staples: state.staples, tried: state.tried, updatedAt: new Date().toISOString() }); $("#sync").textContent = "Pantry and tried list sync across your devices."; }
    catch (e) { if (e && e.code === "invalid_argument") remote = null; $("#sync").textContent = "Your pantry, ticks and notes are saved on this device."; }
    saving = false;
    if (pending) { pending = false; flush(); }
  }, 700);
}
(async () => {
  try {
    const db = await window.claude?.use?.("db"); const user = await window.claude?.use?.("user");
    if (!db || !user) { $("#sync").textContent = "Your pantry, ticks and notes are saved on this device."; return; }
    const id = await user.id(); if (!id) { $("#sync").textContent = "Your pantry, ticks and notes are saved on this device."; return; }
    const ref = db.doc("data/users/" + id + "/state");
    const snap = await ref.get();
    if (snap.exists) {
      const d = snap.data();
      state.pantry = Array.isArray(d.pantry) ? d.pantry.slice() : state.pantry;
      state.staples = Array.isArray(d.staples) ? d.staples.slice() : state.staples;
      state.tried = d.tried && typeof d.tried === "object" ? { ...d.tried } : state.tried;
      try { localStorage.setItem(LS, JSON.stringify({ pantry: state.pantry, staples: state.staples, tried: state.tried })); } catch (e) {}
      render();
    }
    remote = ref;
    $("#sync").textContent = "Pantry and tried list sync across your devices.";
    if (!snap.exists && (state.pantry.length || Object.keys(state.tried).length)) persist();
  } catch (e) { $("#sync").textContent = "Your pantry, ticks and notes are saved on this device."; }
})();

const isTried = r => (keyOf(r) in state.tried) ? state.tried[keyOf(r)] : r.tried;

// ---------- vocab ----------
const freq = {};
R.forEach(r => r.ingredients.forEach(i => { if (!i.optional) freq[i.name] = (freq[i.name] || 0) + 1; }));
const VOCAB = Object.keys(freq).sort((a, b) => freq[b] - freq[a]);
const CUISINES = [...new Set(R.flatMap(r => r.cuisines))].sort();

function canonicalize(text) {
  const t = text.trim().toLowerCase();
  if (!t) return null;
  if (freq[t]) return t;
  if (ALIASES[t]) return ALIASES[t];
  return null;
}
function suggestions(text) {
  const t = text.trim().toLowerCase(); if (!t) return [];
  const out = new Map();
  VOCAB.forEach(v => { if (v.includes(t)) out.set(v, null); });
  Object.entries(ALIASES).forEach(([a, c]) => { if (a.includes(t) && freq[c] && !out.has(c)) out.set(c, a); });
  return [...out.entries()].sort((x, y) => {
    const xs = (x[1] || x[0]).startsWith(t) ? 0 : 1, ys = (y[1] || y[0]).startsWith(t) ? 0 : 1;
    return xs - ys || freq[y[0]] - freq[x[0]];
  }).slice(0, 8);
}

// ---------- matching ----------
function covered(name, pset, sset) {
  if (pset.has(name) || sset.has(name)) return true;
  return (COVERS[name] || []).some(a => pset.has(a));
}
function score(r) {
  const pset = new Set(state.pantry), sset = new Set(state.staples);
  const req = r.ingredients.filter(i => !i.optional && !sset.has(i.name));
  const missing = req.filter(i => !covered(i.name, pset, sset)).map(i => i.name);
  const usedNames = req.filter(i => covered(i.name, pset, sset)).map(i => i.name);
  const used = usedNames.length;
  return { total: req.length, used, usedNames, missing, ratio: req.length ? used / req.length : 0 };
}

// ---------- filtering ----------
function searchHit(r, q) {
  if (!q) return true;
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hay = [r.name, r.author, r.cuisines.join(" "), r.meal, r.notes, (noteFor(r) || {}).text || "",
    r.ingredients.map(i => i.name + " " + i.raws.join(" ")).join(" ")].join(" ").toLowerCase();
  return words.every(w => hay.includes(w) || (ALIASES[w] && hay.includes(ALIASES[w])));
}
function passes(r) {
  if (state.meal && r.meal !== state.meal) return false;
  if (state.diet === "plant" && r.diet !== "vegan") return false;
  if (state.diet === "veg" && r.diet === "meat") return false;
  if (state.diet === "meat" && r.diet !== "meat") return false;
  if (state.maxTime && !(r.time && r.time <= state.maxTime)) return false;
  if (state.cuisine && !r.cuisines.includes(state.cuisine)) return false;
  if (state.notTried && isTried(r)) return false;
  if (state.hideIncomplete && r.incomplete) return false;
  return searchHit(r, state.q);
}

// ---------- rendering ----------
function filtersHTML() {
  const chip = (label, on, act) => `<button class="chip" aria-pressed="${on}" data-act="${act}">${label}</button>`;
  const meals = ["Breakfast", "Lunch", "Dinner", "Snack"];
  return [
    ...meals.map(m => chip(m, state.meal === m, "meal:" + m)),
    chip("Plant-based", state.diet === "plant", "diet:plant"),
    chip("Vegetarian", state.diet === "veg", "diet:veg"),
    chip("Has meat", state.diet === "meat", "diet:meat"),
    chip("30 min or less", state.maxTime === 30, "time:30"),
    chip("Not tried yet", state.notTried, "nottried"),
    chip("Full recipes only", state.hideIncomplete, "complete"),
    `<select class="chip" id="cuisine" aria-label="Cuisine" aria-pressed="${!!state.cuisine}"><option value="">All cuisines</option>${CUISINES.map(c => `<option ${c === state.cuisine ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`,
  ].join("");
}
const DIET = { vegan: ['plant', 'Plant-based'], vegetarian: ['', 'Vegetarian'], meat: ['meat', 'Has meat'] };
function tagsHTML(r) {
  const d = DIET[r.diet];
  return `<div class="tags"><span class="tag ${d[0]}">${d[1]}</span>${r.egg && r.diet !== "meat" ? '<span class="tag">Egg</span>' : ""}${r.incomplete ? '<span class="tag partial">Partial recipe</span>' : ""}${isTried(r) ? '<span class="tag tried">Tried</span>' : ""}${(noteFor(r) || {}).text ? '<span class="tag note">My note</span>' : ""}</div>`;
}
function metaHTML(r) {
  const bits = [r.cuisines.join(" · "), r.meal];
  if (r.time) bits.push(r.time + " min");
  if (r.difficulty) bits.push(r.difficulty);
  return `<div class="meta">${bits.map(esc).map(b => `<span>${b}</span>`).join("")}${r.author ? `<span class="by">${esc(r.author)}</span>` : ""}</div>`;
}
function cardHTML(r, s) {
  let match = "";
  if (s) {
    const pct = s.total ? Math.round(100 * s.used / s.total) : 0;
    const need = s.missing.length === 0
      ? `<div class="mrow"><span class="mlabel ok">Ready</span><span class="ready">You have all ${s.total} ingredients</span></div>`
      : `<div class="mrow"><span class="mlabel need">Need</span><span class="need-list">${esc(s.missing.slice(0, 5).join(", "))}${s.missing.length > 5 ? ` <em>+${s.missing.length - 5} more</em>` : ""}</span></div>`;
    match = `<div class="match">
      <div class="mrow"><span class="mlabel">Uses</span><span class="uses">${s.usedNames.map(n => `<span class="u">${esc(n)}</span>`).join("")}</span></div>
      ${need}
      <div class="bar" title="${s.used} of ${s.total} ingredients"><i style="width:${pct}%"></i></div>
      <div class="frac">${s.used} of ${s.total} ingredients${s.missing.length ? "" : " · nothing to buy"}</div>
    </div>`;
  }
  return `<button class="card" data-open="${r.id}"><h3>${esc(r.name)}</h3>${metaHTML(r)}${match}${tagsHTML(r)}</button>`;
}

function renderPantry() {
  const p = $("#pantryPanel");
  if (state.mode !== "cook") { p.hidden = true; return; }
  p.hidden = false;
  const pset = new Set(state.pantry), sset = new Set(state.staples);
  const has = state.pantry.length > 0;
  const showIdeas = !has || state.showIdeas;
  const quick = VOCAB.filter(v => !sset.has(v) && !pset.has(v)).slice(0, has ? 20 : 28);
  p.innerHTML = `<div class="pantry">
    ${has ? "" : `<div><h2>What's in your kitchen?</h2><p>Add what you have. Each recipe below shows which of your ingredients it uses and what you'd still need.</p></div>`}
    <div class="add"><input id="addIng" placeholder="Add an ingredient, e.g. paneer, curd, capsicum" autocomplete="off" aria-label="Add an ingredient"><div class="sugg" id="sugg" hidden></div></div>
    ${has ? `<div class="row"><span class="label">Your ingredients · ${state.pantry.length}</span><button class="linkish" id="clearP">${clearArmed ? "Tap again to clear all" : "Clear all"}</button></div><div class="have-list">${state.pantry.map(n => `<button class="pill" data-rm="${esc(n)}" aria-label="Remove ${esc(n)}">${esc(n)}<span>×</span></button>`).join("")}</div>` : ""}
    ${showIdeas ? `<div><div class="row"><span class="label">Common in your recipes</span>${has ? `<button class="linkish" data-ideas="0">Hide</button>` : ""}</div><div class="quick" style="margin-top:6px">${quick.map(n => `<button class="chip" data-add="${esc(n)}">+ ${esc(n)}</button>`).join("")}</div></div>` : `<button class="linkish" data-ideas="1">+ Pick from common ingredients</button>`}
    <details class="staples-box" id="staplesBox" ${state.staplesOpen ? "open" : ""}><summary>Always in my kitchen <span class="scount">${state.staples.length}</span><span class="sprev">${esc(state.staples.join(", ") || "nothing yet")}</span></summary>
      <p>Things you always keep stocked. Recipes treat them as on hand, so they never show up as "need".</p>
      <div class="add"><input id="addStaple" placeholder="Add a staple, e.g. garlic, cumin, soy sauce" autocomplete="off" aria-label="Add a staple"><div class="sugg" id="suggS" hidden></div></div>
      <div class="staples">${[...DEFAULT_STAPLES, ...state.staples.filter(s => !DEFAULT_STAPLES.includes(s))].map(s => DEFAULT_STAPLES.includes(s)
        ? `<button class="chip" aria-pressed="${sset.has(s)}" data-staple="${esc(s)}" title="${sset.has(s) ? "Tap to switch off" : "Tap to switch on"}">${esc(s)}</button>`
        : `<button class="pill" data-unstaple="${esc(s)}" aria-label="Remove ${esc(s)} from staples">${esc(s)}<span>×</span></button>`).join("")}</div>
      ${STAPLE_IDEAS.filter(s => !sset.has(s) && freq[s]).length ? `<div class="label" style="margin-top:4px">Often kept stocked</div><div class="quick">${STAPLE_IDEAS.filter(s => !sset.has(s) && freq[s]).map(s => `<button class="chip" data-addstaple="${esc(s)}">+ ${esc(s)}</button>`).join("")}</div>` : ""}
    </details>
  </div>`;
}
let clearArmed = false;
const STAPLE_IDEAS = ["garlic", "onion", "ginger", "cumin", "turmeric", "red chilli powder", "coriander powder", "garam masala", "chilli flakes", "paprika", "garlic powder", "soy sauce", "butter", "lemon", "vinegar", "cornstarch", "flour", "rice"];

function renderResults() {
  const list = R.filter(passes);
  const out = $("#results");
  $("#count").textContent = R.length + " recipes";
  if (state.mode === "browse") {
    $("#note").textContent = list.length === R.length ? `All ${R.length} saved recipes` : `${list.length} of ${R.length} recipes`;
    if (!list.length) { out.innerHTML = `<div class="empty">No recipes match. Try a different word or clear a filter.</div>`; return; }
    const shown = list.slice(0, state.browseLimit);
    out.innerHTML = `<div class="list">${shown.map(r => cardHTML(r)).join("")}</div>${list.length > shown.length ? `<button class="more" data-more="1">Show ${Math.min(40, list.length - shown.length)} more</button>` : ""}`;
    return;
  }
  if (!state.pantry.length) {
    $("#note").textContent = "";
    out.innerHTML = `<div class="empty">Add a few ingredients above and your matching recipes appear here, best matches first.</div>`;
    return;
  }
  const scored = list.map(r => ({ r, s: score(r) })).filter(x => x.s.used > 0 && x.s.total > 0)
    // Favour recipes that use more of what you have, with a penalty for each thing you'd need to buy.
    .sort((a, b) => (b.s.used - 0.25 * b.s.missing.length) - (a.s.used - 0.25 * a.s.missing.length) || b.s.ratio - a.s.ratio);
  const groups = [
    ["g0", "Ready to cook", "Ready to cook", "You have every ingredient", x => x.s.missing.length === 0],
    ["g1", "Almost there", "Need 1–2 things", "Missing one or two ingredients", x => x.s.missing.length >= 1 && x.s.missing.length <= 2],
    ["g2", "Uses your ingredients", "Need a shop", "Most of your ingredients first", x => x.s.missing.length >= 3],
  ].map(g => ({ id: g[0], title: g[1], short: g[2], sub: g[3], items: scored.filter(g[4]) }));
  $("#note").textContent = "";
  if (!scored.length) { out.innerHTML = `<div class="empty">None of your recipes use ${esc(state.pantry.join(", "))}. Try adding a few more ingredients.</div>`; return; }
  const summary = `<div class="summary" role="status">
    <p><b>${scored.length}</b> of your recipes use ${state.pantry.length === 1 ? esc(state.pantry[0]) : "at least one of your ingredients"}.${groups[0].items.length ? "" : " None are fully covered yet, so the closest matches are first."}</p>
    <div class="jumps">${groups.map(g => `<button class="jump${g.items.length ? "" : " zero"}" data-jump="${g.id}" ${g.items.length ? "" : "disabled"}><b>${g.items.length}</b> ${g.short}</button>`).join("")}</div>
  </div>`;
  out.innerHTML = summary + groups.map((g, gi) => {
    if (!g.items.length) return "";
    let items = g.items;
    const capped = gi === 2 && !state.showAllCook && items.length > 12;
    if (capped) items = items.slice(0, 12);
    return `<h2 class="section" id="${g.id}">${g.title} <small>${g.items.length}${g.sub ? " · " + g.sub : ""}</small></h2><div class="list">${items.map(x => cardHTML(x.r, x.s)).join("")}</div>${capped ? `<button class="more" data-allcook="1">Show all ${g.items.length}</button>` : ""}`;
  }).join("");
}

function render() {
  $("#tab-browse").setAttribute("aria-selected", state.mode === "browse");
  $("#tab-cook").setAttribute("aria-selected", state.mode === "cook");
  $("#filters").innerHTML = filtersHTML();
  $("#searchBox").hidden = state.mode === "cook";
  renderPantry();
  renderResults();
}

// ---------- detail sheet ----------
function openSheet(id) {
  const r = R.find(x => x.id === id); if (!r) return;
  const pset = new Set(state.pantry), sset = new Set(state.staples);
  const s = score(r);
  const lines = [];
  r.ingredients.forEach(i => i.raws.forEach(raw => { if (!lines.some(l => l.raw === raw)) lines.push({ raw, name: i.name, optional: i.optional }); }));
  const usePantry = state.pantry.length > 0;
  const ck = getChecks(r);
  const li = (l, i) => {
    let cls = l.optional ? "opt" : "";
    if (usePantry) cls += covered(l.name, pset, sset) ? " have" : (l.optional ? "" : " need");
    return `<li><button class="ing ${cls}" data-ing="${i}" aria-pressed="${ck.i.includes(i)}"><span class="box" aria-hidden="true"></span><span class="txt">${esc(l.raw)}</span></button></li>`;
  };
  openKey = keyOf(r);
  const tried = isTried(r);
  $("#sheetRoot").innerHTML = `<div class="scrim" data-close="1"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div><button class="close" data-close="1" aria-label="Close">×</button>
    <h2 id="sheetTitle">${esc(r.name)}</h2>${metaHTML(r)}<div style="margin-top:8px">${tagsHTML(r)}</div>
    <div class="actions">
      ${r.link ? `<a class="btn primary" href="${esc(r.link)}" target="_blank" rel="noopener">Watch on Instagram ↗</a>` : `<span class="btn">Made by AI, no post to link</span>`}
      <button class="btn" data-tried="${r.id}">${tried ? "✓ Tried" : "Mark as tried"}</button>
    </div>
    ${r.incomplete ? `<div class="notice"><b>Partial recipe.</b> ${esc(r.incomplete)}</div>` : ""}
    ${usePantry ? `<p class="missing">${s.missing.length ? `You have ${s.used} of ${s.total}. Need: <b>${esc(s.missing.join(", "))}</b>` : `<span class="ready">You have everything you need.</span>`}</p>` : ""}
    <div class="cl-head"><h4>Ingredients</h4><span class="cl-count" id="ingCount"></span><button class="linkish cl-reset" data-reset="i">Untick all</button></div>
    <p class="steps-hint">Tick things off as you get them out.</p>
    <ul class="ings" data-total="${lines.length}">${lines.map(li).join("")}</ul>
    <div class="cl-head"><h4>Method</h4><span class="cl-count" id="stepCount"></span>${r.method && r.method.length ? `<button class="linkish cl-reset" data-reset="s">Untick all</button>` : ""}</div>
    ${r.method && r.method.length
      ? `<p class="steps-hint">Tick each step when it's done.</p><ol class="steps" data-total="${r.method.length}">${r.method.map((st, i) => `<li><button class="step" data-step="${i}" aria-pressed="${ck.s.includes(i)}"><span class="n">${i + 1}</span><span>${esc(st)}</span></button></li>`).join("")}</ol>`
      : `<p class="notice">The steps aren't written in this post. ${r.link ? "Watch the reel for the method." : ""}</p>`}
    <div class="cl-head"><h4>My notes</h4></div>
    <label class="sr" for="myNote">My notes for ${esc(r.name)}</label>
    <textarea id="myNote" rows="4" placeholder="What did you change? How did it turn out? What would you do next time?">${esc((noteFor(r) || {}).text || "")}</textarea>
    <div class="note-bar"><span id="noteStatus" class="note-status" role="status"></span><button class="btn primary" id="saveNote" data-savenote="${r.id}">Save note</button></div>
    ${r.notes ? `<p class="notes"><b>About this recipe:</b> ${esc(r.notes)}</p>` : ""}
  </div>`;
  document.body.style.overflow = "hidden";
  updateCounts();
  showNoteStatus(r);
}
// ---------- my notes ----------
// The owner's notes save to their private part of the app's database (they follow them across devices),
// and a scheduled task copies them into the "Yummeroo Notes" Google Sheet every 6 hours, as part of the recipe sync.
// Everyone else's notes stay in their own browser on their own device.
const NK = "yummeroo.notes";
let notesRef = null, ownerNotes = {}, isOwnerView = false, notesReady = false, savingNote = false;
function localNotes() { try { return JSON.parse(localStorage.getItem(NK) || "{}") || {}; } catch (e) { return {}; } }
function setLocalNote(k, v) { const a = localNotes(); if (v) a[k] = v; else delete a[k]; try { localStorage.setItem(NK, JSON.stringify(a)); } catch (e) {} }
function noteFor(r) {
  const k = keyOf(r);
  if (notesRef) { const n = ownerNotes[k]; return n && n.note ? { text: n.note, updated: n.updated, synced: true } : null; }
  const l = localNotes()[k];
  return l && l.note ? { text: l.note, updated: l.updated, synced: false } : null;
}
const stamp = () => new Date().toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
const isiOS = /iP(hone|ad|od)/.test(navigator.userAgent);
function showNoteStatus(r, override) {
  const el = document.getElementById("noteStatus"); if (!el) return;
  if (override) { el.textContent = override.text; el.className = "note-status " + (override.kind || ""); return; }
  const n = noteFor(r);
  if (notesRef) {
    el.textContent = n ? `Saved ${n.updated ? "· " + n.updated + " · " : "· "}copies to your notes sheet at the next sync` : "Your notes copy to your Yummeroo Notes sheet every 6 hours.";
    el.className = "note-status" + (n ? " ok" : "");
  } else {
    el.textContent = (n ? `Saved on this device${n.updated ? " · " + n.updated : ""}. ` : "Notes are saved on this device. ") + (isiOS ? "Add this app to your home screen so Safari keeps them." : "");
    el.className = "note-status" + (n ? " ok" : "");
  }
}
async function saveNote(r) {
  if (savingNote) return;
  const box = document.getElementById("myNote"); if (!box) return;
  const text = box.value.trim(), k = keyOf(r), when = stamp();
  if (!text && !noteFor(r)) { showNoteStatus(r, { text: "Nothing to save yet." }); return; }
  if (!notesRef) {
    setLocalNote(k, text ? { note: text, updated: when, name: r.name, link: r.link || "" } : null);
    showNoteStatus(r); renderResults(); return;
  }
  savingNote = true; const btn = document.getElementById("saveNote"); if (btn) btn.disabled = true;
  showNoteStatus(r, { text: "Saving…" });
  const next = { ...ownerNotes };
  if (text) next[k] = { note: text, updated: when, name: r.name, link: r.link || "", at: Date.now() };
  else delete next[k];
  try {
    await notesRef.set({ notes: next, updatedAt: new Date().toISOString() });
    ownerNotes = next;
    setLocalNote(k, null);  // nothing left waiting on this device
    showNoteStatus(r, { text: text ? `Saved · ${when} · copies to your notes sheet at the next sync` : "Note cleared. It comes off your notes sheet at the next sync.", kind: "ok" });
  } catch (e) {
    setLocalNote(k, text ? { note: text, updated: when, name: r.name, link: r.link || "", pending: true } : null);
    showNoteStatus(r, { text: "Couldn't save to your account just now, so it's kept on this device. Tap Save note again in a moment.", kind: "warn" });
  }
  savingNote = false; if (btn) btn.disabled = false;
  renderResults();
}
(async () => {
  try {
    const db = await window.claude?.use?.("db"); const user = await window.claude?.use?.("user");
    if (!db || !user || !user.isOwner()) { notesReady = true; return; }
    const id = await user.id(); if (!id) { notesReady = true; return; }
    isOwnerView = true;
    const ref = db.doc("data/users/" + id + "/notes");
    let first = true;
    ref.onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      ownerNotes = d && d.notes && typeof d.notes === "object" ? { ...d.notes } : {};
      if (first) {
        first = false; notesRef = ref; notesReady = true;
        // move any notes written on this device before (or while offline) into the account
        const loc = localNotes(), keys = Object.keys(loc).filter(k => loc[k] && loc[k].note && (!ownerNotes[k] || loc[k].pending));
        if (keys.length) {
          const next = { ...ownerNotes };
          keys.forEach(k => { const v = loc[k]; next[k] = { note: v.note, updated: v.updated, name: v.name, link: v.link, at: Date.now() }; });
          ref.set({ notes: next, updatedAt: new Date().toISOString() }).then(() => { ownerNotes = next; keys.forEach(k => setLocalNote(k, null)); renderResults(); }).catch(() => {});
        }
      }
      renderResults();
      const open = openKey && R.find(x => keyOf(x) === openKey);
      if (open && !savingNote) {
        const box = document.getElementById("myNote");
        if (box && document.activeElement !== box) box.value = (noteFor(open) || {}).text || "";
        showNoteStatus(open);
      }
    }, () => { notesReady = true; });
  } catch (e) { notesReady = true; }
})();

// ---------- checklist ticks (kept on this device, per recipe) ----------
const CK = "yummeroo.checks";
let openKey = null;
function allChecks() { try { return JSON.parse(localStorage.getItem(CK) || "{}") || {}; } catch (e) { return {}; } }
function getChecks(r) { const c = allChecks()[keyOf(r)] || {}; return { i: c.i || [], s: c.s || [] }; }
function saveChecks() {
  if (!openKey) return;
  const c = allChecks();
  const pick = sel => [...document.querySelectorAll(sel)].filter(b => b.getAttribute("aria-pressed") === "true").map(b => +(b.dataset.ing ?? b.dataset.step));
  const i = pick(".ing"), s = pick(".step");
  if (i.length || s.length) c[openKey] = { i, s, at: Date.now() }; else delete c[openKey];
  try { localStorage.setItem(CK, JSON.stringify(c)); } catch (e) {}
}
function updateCounts() {
  const show = (id, sel, box) => {
    const el = document.getElementById(id); if (!el) return;
    const all = document.querySelectorAll(sel), done = [...all].filter(b => b.getAttribute("aria-pressed") === "true").length;
    el.textContent = all.length ? (done === all.length ? `All ${all.length} done` : `${done} of ${all.length}`) : "";
    el.classList.toggle("all", all.length > 0 && done === all.length);
    const reset = el.parentElement.querySelector(".cl-reset"); if (reset) reset.hidden = done === 0;
  };
  show("ingCount", ".ing"); show("stepCount", ".step");
}
function closeSheet() { $("#sheetRoot").innerHTML = ""; document.body.style.overflow = ""; }

// ---------- events ----------
function addIng(n) { if (n && !state.pantry.includes(n)) { state.pantry.unshift(n); persist(); } }
function addStaple(n) {
  if (!n) return;
  if (!state.staples.includes(n)) state.staples = [...state.staples, n];
  state.pantry = state.pantry.filter(x => x !== n);  // a staple doesn't need to be in the list too
  persist();
}
function refocus(id) { const i = document.getElementById(id); if (i) i.focus(); }
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-close]"); if (!t) return;
  if (t.id === "tab-browse" || t.id === "tab-cook") { state.mode = t.id === "tab-cook" ? "cook" : "browse"; render(); return; }
  if (t.dataset.close) return closeSheet();
  if (t.dataset.step || t.dataset.ing) { t.setAttribute("aria-pressed", t.getAttribute("aria-pressed") !== "true"); saveChecks(); updateCounts(); return; }
  if (t.dataset.savenote) { const r = R.find(x => x.id === +t.dataset.savenote); if (r) saveNote(r); return; }
  if (t.dataset.reset) { document.querySelectorAll(t.dataset.reset === "i" ? ".ing" : ".step").forEach(b => b.setAttribute("aria-pressed", "false")); saveChecks(); updateCounts(); return; }
  if (t.dataset.open) return openSheet(+t.dataset.open);
  if (t.dataset.tried) {
    const r = R.find(x => x.id === +t.dataset.tried); state.tried[keyOf(r)] = !isTried(r); persist(); openSheet(r.id); render(); return;
  }
  if (t.dataset.ideas) { state.showIdeas = t.dataset.ideas === "1"; renderPantry(); return; }
  if (t.dataset.jump) { const el = document.getElementById(t.dataset.jump); if (el) { const y = el.getBoundingClientRect().top + window.scrollY - document.querySelector("header.top").offsetHeight - 8; window.scrollTo({ top: y, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); } return; }
  if (t.dataset.more) { state.browseLimit += 40; renderResults(); return; }
  if (t.dataset.allcook) { state.showAllCook = true; renderResults(); return; }
  if (t.dataset.add) { addIng(t.dataset.add); clearArmed = false; renderPantry(); renderResults(); const inp = $("#addIng"); return; }
  if (t.dataset.rm) { state.pantry = state.pantry.filter(x => x !== t.dataset.rm); persist(); clearArmed = false; renderPantry(); renderResults(); return; }
  if (t.dataset.staple) { const s = t.dataset.staple; state.staples = state.staples.includes(s) ? state.staples.filter(x => x !== s) : [...state.staples, s]; persist(); renderPantry(); renderResults(); return; }
  if (t.id === "clearP") { if (clearArmed) { state.pantry = []; persist(); clearArmed = false; } else { clearArmed = true; setTimeout(() => { if (clearArmed) { clearArmed = false; renderPantry(); } }, 3000); } renderPantry(); renderResults(); return; }
  if (t.dataset.addstaple) { addStaple(t.dataset.addstaple); renderPantry(); renderResults(); return; }
  if (t.dataset.ssugg) { addStaple(t.dataset.ssugg); renderPantry(); renderResults(); refocus("addStaple"); return; }
  if (t.dataset.unstaple) { state.staples = state.staples.filter(x => x !== t.dataset.unstaple); persist(); renderPantry(); renderResults(); return; }
  if (t.dataset.sugg) { addIng(t.dataset.sugg); renderPantry(); renderResults(); const i = $("#addIng"); if (i) i.focus(); return; }
  const a = t.dataset.act; if (!a) return;
  const [k, v] = a.split(":");
  if (k === "meal") state.meal = state.meal === v ? null : v;
  if (k === "diet") state.diet = state.diet === v ? null : v;
  if (k === "time") state.maxTime = state.maxTime ? null : +v;
  if (k === "nottried") state.notTried = !state.notTried;
  if (k === "complete") state.hideIncomplete = !state.hideIncomplete;
  state.browseLimit = 40;
  $("#filters").innerHTML = filtersHTML(); renderResults();
});
document.addEventListener("change", e => { if (e.target.id === "cuisine") { state.cuisine = e.target.value; state.browseLimit = 40; $("#filters").innerHTML = filtersHTML(); renderResults(); } });
let qTimer;
$("#q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value.trim(); state.browseLimit = 40; renderResults(); }, 120); });
document.addEventListener("toggle", e => { if (e.target.id === "staplesBox") state.staplesOpen = e.target.open; }, true);
document.addEventListener("input", e => {
  const staple = e.target.id === "addStaple";
  if (e.target.id !== "addIng" && !staple) return;
  const box = staple ? $("#suggS") : $("#sugg"), list = suggestions(e.target.value);
  box.hidden = !list.length;
  box.innerHTML = list.map(([c, via], i) => `<button ${staple ? "data-ssugg" : "data-sugg"}="${esc(c)}" class="${i === 0 ? "on" : ""}"><span>${esc(c)}</span><small>${via ? "for “" + esc(via) + "” · " : ""}${freq[c]} recipe${freq[c] === 1 ? "" : "s"}</small></button>`).join("");
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if (e.target.id === "addIng" && e.key === "Enter") {
    e.preventDefault();
    const first = suggestions(e.target.value)[0];
    const n = first ? first[0] : canonicalize(e.target.value);
    if (n) { addIng(n); renderPantry(); renderResults(); const i = $("#addIng"); if (i) i.focus(); }
  }
  if (e.target.id === "addStaple" && e.key === "Enter") {
    e.preventDefault();
    const first = suggestions(e.target.value)[0];
    const n = first ? first[0] : canonicalize(e.target.value);
    if (n) { addStaple(n); renderPantry(); renderResults(); refocus("addStaple"); }
  }
});
render();
})();
</script>
